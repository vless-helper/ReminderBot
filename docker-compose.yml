# Образы закреплены по ID, а не по тегу.
#
# Раньше везде стояло :latest, и это уже стоило нам инцидента: sing-box
# пересобирает latest на каждый коммит, поэтому «latest» на момент запуска и
# «latest» в реестре — разные образы (проверено: конфиг-дайджест в реестре
# fb81c40c, а работает 9bed1fcb). Тег v1.13.11 тоже не подходит: он собран
# иначе и даёт другой config-digest.
#
# Следствие: `docker compose pull` для закреплённых сервисов не работает.
# Обновление — только явно:
#   docker pull ghcr.io/sagernet/sing-box:latest
#   docker inspect -f '{{.Image}}' <новый контейнер>   # подставить новый ID
# и обновить image в этом файле, после чего `docker compose up -d`.
x-logging: &logging
  driver: json-file
  options:
    # 10 файлов по 10 МБ на сервис. Без этого логи растут без ограничения
    # и рано или поздно съедают диск.
    max-size: "10m"
    max-file: "10"

services:
  db:
    # PostgreSQL 16.15
    image: sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: reminder-bot-db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Порт наружу не публикуем: к базе ходит только бот
    expose:
      - "5432"

  # Перезапускает sing-box после изменения списка клиентов. Без него
  # менеджер отвечает 500 на любое создание/блокировку.
  reloader:
    image: sha256:a71e7980da989d05b06ee8507f8c55630d164cbf5de2aee592c07d8a396f87c1
    container_name: reminder-sing-box-reloader
    restart: unless-stopped
    logging: *logging
    environment:
      LISTEN_ADDR: ":8080"
      SING_BOX_CONTAINER: "reminder-sing-box"
      RESTART_TIMEOUT_SECONDS: "10"
      RELOAD_TOKEN: ${RELOADER_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8080"
    healthcheck:
      # Слушает ли он свой порт. Своего /health у reloader нет — все маршруты
      # отдают 404, — поэтому проверяем сам факт LISTEN в /proc/net/tcp.
      # Без этого поломка reloader'а молча ломала выдачу конфигов: менеджер
      # отвечает 500, бот падает, а статус контейнера остаётся «Up».
      test:
        - CMD-SHELL
        - grep -q ':1F90 .*0A' /proc/net/tcp /proc/net/tcp6 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sing-box:
    # sing-box 1.13.11
    image: sha256:9bed1fcb406bd971d1b48c7f824e5128d63543ca278cdcd6b5737c19941e404d
    container_name: reminder-sing-box
    restart: unless-stopped
    logging: *logging
    command: ["run", "-c", "/etc/sing-box/config.json"]
    volumes:
      - ./config:/etc/sing-box
    cap_add:
      - NET_ADMIN
    ports:
      - "443:443"
    healthcheck:
      # Две проверки: конфиг остаётся валидным и порт действительно слушается.
      # Валидность конфига важна отдельно: битый конфиг не роняет уже
      # запущенный sing-box, а следующий перезапуск reloader'а его уронит —
      # и без этой проверки VPN выглядел бы живым до самого рестарта.
      test:
        - CMD-SHELL
        - sing-box check -c /etc/sing-box/config.json && grep -q ':01BB .*0A' /proc/net/tcp /proc/net/tcp6
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  vless-manager:
    build:
      context: ./manager
    container_name: reminder-vless-manager
    restart: unless-stopped
    logging: *logging
    env_file:
      - manager.env
    environment:
      API_PORT: "8080"
      SERVER_JSON_NAME: /app/state/config.json
      CLIENTS_JSON_NAME: /app/state/clients.json
    # Монтируем каталог, а не отдельные файлы: менеджер пишет JSON через
    # «записать во временный файл + переименовать», а rename поверх
    # bind-mounted файла на Linux падает с EBUSY.
    volumes:
      - ./config:/app/state
    depends_on:
      reloader:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  bot:
    build:
      context: ./app
    container_name: reminder-bot
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      BOT_HEARTBEAT: /state/bot_heartbeat
    volumes:
      - state:/state
    depends_on:
      db:
        condition: service_healthy
      vless-manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "bot.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Гасит просроченные подписки независимо от бота: нужны только БД и
  # админка. Без него падение контейнера бота оставляло бы клиентов
  # с работающим VPN.
  expiry-watchdog:
    build:
      context: ./app
    container_name: reminder-expiry-watchdog
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "bot.expiry_watchdog"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      WATCHDOG_INTERVAL: "300"
      WATCHDOG_HEARTBEAT: /state/watchdog_heartbeat
    volumes:
      - state:/state
    depends_on:
      db:
        condition: service_healthy
      vless-manager:
        condition: service_started
    healthcheck:
      # Проверяем heartbeat, а не наличие процесса: так ловится и смерть
      # сторожа, и цикл, который перестал гасить просрочку. pgrep в образе нет.
      test: ["CMD", "python", "-m", "bot.expiry_watchdog", "--health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Проверяет, что сервисы живы, и пишет админу при поломке. Отдельный
  # сервис, а не часть сторожа: поломка мониторинга не должна гасить
  # просрочку, и наоборот. Telegram нужен только для отправки алерта —
  # апдейты он не слушает, поэтому падение бота не мешает сообщить о нём.
  monitor:
    build:
      context: ./app
    container_name: reminder-monitor
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "bot.monitor"]
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MONITOR_INTERVAL: "120"
      MONITOR_STATE_DIR: /state
      MONITOR_PING_URL: ${MONITOR_PING_URL:-}
      MONITOR_HEALTH_PORT: "8099"
    ports:
      # Наружу отдаётся только /healthz — для внешнего сторожа (Cronitor).
      # Ответ содержит лишь список сломанных проверок: ни секретов, ни
      # управления. Запросы, отличные от /healthz, отвечаются как 404.
      - "8099:8099"
    volumes:
      - state:/state
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Heartbeat, а не наличие процесса: иначе зависший цикл выглядит живым.
      test: ["CMD", "python", "-m", "bot.monitor", "--health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    driver: local
    name: reminder-bot-db-data
  # Общий том для heartbeat-файлов бота, сторожа и монитора: это разные
  # контейнеры, и в своём /tmp они видят только себя.
  state:
    driver: local
    name: reminder-bot-state