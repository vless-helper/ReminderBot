services:
  db:
    image: postgres:16-alpine
    container_name: reminder-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-reminderbot}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reminderbot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем: к базе ходит только бот
    expose:
      - "5432"

  bot:
    build: .
    container_name: reminder-bot
    restart: unless-stopped
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      TZ: ${TZ:-Europe/Moscow}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-reminderbot}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "bot.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  db_data:
    driver: local
    name: reminder-bot-db-data
