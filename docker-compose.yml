
services:
  bot:
    build: .
    network_mode: host
    container_name: reminder-bot
    restart: unless-stopped
    volumes:
      # Монтируем том для базы данных
      - bot_data:/app/data
      # Монтируем файл .env (опционально)
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/bot.db
      - TZ=Europe/Moscow
    env_file:
      - .env

  reminder:
    build: .
    container_name: reminder-bot-reminder
    restart: unless-stopped
    volumes:
      - bot_data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/bot.db
      - TZ=Europe/Moscow
    env_file:
      - .env
    command: python -m bot.reminder
    network_mode: host

volumes:
  bot_data:
    driver: local
    name: reminder-bot-data
